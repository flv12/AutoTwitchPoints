<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>AutoTwitchPoints</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #9147ff 0%, #772ce8 100%);
        min-width: 320px;
        min-height: 280px;
        padding: 20px;
        color: white;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .header img {
        width: 32px;
        height: 32px;
      }

      .header h1 {
        font-size: 14px;
        font-weight: 600;
      }

      .stats-card {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        backdrop-filter: blur(10px);
      }

      .main-stat {
        text-align: center;
        margin-bottom: 8px;
      }

      .main-stat .value {
        font-size: 36px;
        font-weight: 700;
        display: block;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      .main-stat .label {
        font-size: 12px;
        opacity: 0.85;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px;
        text-align: center;
      }

      .stat-item .value {
        font-size: 18px;
        font-weight: 600;
        display: block;
      }

      .stat-item .label {
        font-size: 10px;
        opacity: 0.75;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
        opacity: 0.85;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: #00f593;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .reset-btn {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: white;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .reset-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .confirm-box {
        display: none;
        margin-top: 12px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        text-align: center;
      }

      .confirm-box.visible {
        display: block;
      }

      .confirm-box p {
        font-size: 12px;
        margin-bottom: 10px;
      }

      .confirm-buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .confirm-buttons button {
        padding: 6px 16px;
        border-radius: 4px;
        border: none;
        font-size: 11px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .confirm-buttons button:hover {
        opacity: 0.85;
      }

      .btn-confirm {
        background: #e91916;
        color: white;
      }

      .btn-cancel {
        background: rgba(255, 255, 255, 0.2);
        color: white;
      }

      .emoji {
        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <img src="../icons/icon-48.png" alt="AutoTwitchPoints">
      <h1>AutoTwitchPoints</h1>
    </div>

    <div class="stats-card">
      <div class="main-stat">
        <span class="value" id="total-points">0</span>
        <span class="label">Points collectés <span class="emoji">🎉</span></span>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span class="value" id="claims-count">0</span>
          <span class="label">Réclamations</span>
        </div>
        <div class="stat-item">
          <span class="value" id="avg-points">0</span>
          <span class="label">Moyenne/claim</span>
        </div>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>Extension active</span>
    </div>

    <button class="reset-btn" id="reset-btn">Réinitialiser les statistiques</button>

    <div class="confirm-box" id="confirm-box">
      <p>Réinitialiser toutes les statistiques ?</p>
      <div class="confirm-buttons">
        <button class="btn-confirm" id="btn-confirm">Confirmer</button>
        <button class="btn-cancel" id="btn-cancel">Annuler</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
